name: Compilar app

# Compila o APK (sem assinatura) e publica no branch "build".
# A assinatura e feita fora do GitHub, com a chave do projeto.
on:
  push:
    branches: [main]
    paths: [app/**, build.gradle, settings.gradle, gradle.properties, .github/workflows/build.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Compilar
        id: gradle
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Publicar no branch build
        run: |
          mkdir out && cp build.log out/
          cp app/build/outputs/apk/release/*.apk out/ 2>/dev/null || true
          echo "${{ steps.gradle.outcome }} ${{ github.sha }}" > out/status.txt
          cd out && git init -q -b build
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Build ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" build
      - if: steps.gradle.outcome != 'success'
        run: exit 1
